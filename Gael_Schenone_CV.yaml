cv:
  name: Gael Schenone
  headline: Técnico en Computación
  email: gael@schenone.com.ar
  photo: photo_circular.png
  social_networks:
    - network: GitHub
      username: GaelSchenone
  sections:
    Resumen:
      - Técnico en Computación con orientación en diseño UX/UI y desarrollo front end. Manejo de tecnologías web modernas como HTML, CSS, JavaScript y React JS, junto con conocimientos en Python, Java/C++ y SQL. Enfocado en seguir creciendo profesionalmente, aplicar lo aprendido en proyectos reales y aportar soluciones concretas desde el primer día.
    Education:
      - institution: ETN3 María Sánchez de Thompson
        area: Técnico en Computación
        location: CABA, Argentina
        start_date: 2021-03
        end_date: present
        summary: Durante la carrera desarrollé una formación técnica integral que combina teoría y práctica de laboratorio. Trabajé con arquitectura de computadoras, sistemas operativos Windows y Linux, redes LAN, diagnóstico de fallas de hardware/software, programación y documentación técnica.
    Experiencia:
      - company: Hipódromo de Palermo
        position: Pasante — Área de Automatizaciones
        location: CABA, Argentina
        start_date: 2026-08
        end_date: present
        highlights:
          - Automatizo procesos de distintas áreas para reducir tareas manuales.
          - Diseño flujos de integración entre sistemas.
          - Desarrollo APIs de integración y programo ejecuciones periódicas.
          - Centralizo reportes y genero informes automáticos por mail.
          - "Stack: n8n, Python, React JS, Power BI, Azure, Microsoft 365, Claude Code"
    Proyectos:
      - name: "[halium-a045m](https://github.com/GaelSchenone/halium-a045m)"
        summary: Port de GNU/Linux basado en Halium para el Samsung Galaxy A04 (SM-A045M, MediaTek MT6765). Reemplaza Android por un userspace de escritorio Linux real mediante libhybris, manteniendo el kernel y los HALs del fabricante.
        highlights:
          - "Stack: Halium, libhybris, Shell"
      - name: "[Sasha Gala Portfolio](https://github.com/GaelSchenone/Sasha-Gala-Portfolio)"
        summary: Portfolio de diseño gráfico con CMS full-stack. SPA en React 19 + Vite sobre una API REST en Flask, con panel de admin (Google OAuth/JWT), galerías por proyecto definidas en JSON, temas en tiempo de ejecución y gestión de medios con Cloudinary.
        highlights:
          - "Stack: React 19, Vite, Flask, Cloudinary"
      - name: "[Cinemarx](https://github.com/GaelSchenone/CINEMARX) — Proyecto académico"
        date: 2025-01
        summary: Lideré un equipo de 11 personas coordinando el desarrollo completo del sistema. Diseñé toda la interfaz en gestión de archivos y produje videos de capacitación de Git para el equipo.
        highlights:
          - "Rol: Team Leader, Diseñador UX/UI, Desarrollador · Stack: Java, JavaFX/Swing, MySQL, Figma, Git, NetBeans"
    Habilidades:
      - label: Habilidades Técnicas
        details: HTML5/CSS3/JS (Avanzado), React JS (Intermedio), Python (Avanzado), Java (Básico), C (Intermedio), C++ (Intermedio), SQL (Avanzado), Google Workspace (Intermedio), Claude Code, OpenCode
      - label: Idiomas
        details: Español (Nativo), Inglés (Habla, Lectura y Escritura)
      - label: Habilidades Blandas
        details: Trabajo en equipo ★★★★☆, Colaboración ★★★☆☆, Resolución de problemas ★★★★☆, Liderazgo ★★★★★, Toma de decisiones ★★★★★
